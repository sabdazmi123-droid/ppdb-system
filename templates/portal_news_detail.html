<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{.Item.Title}} — RA Tunas Cendekia</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head>
<body class="min-h-screen bg-[#f5f8f6] text-slate-800"><header class="border-b bg-white"><div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-4"><a href="/" class="flex items-center gap-3"><img src="/static/img/logotk.png?v=5" class="h-10 w-10 object-contain" alt="Logo"><strong>RA Tunas Cendekia</strong></a><a href="/#berita" class="text-sm font-bold text-emerald-700"><i class="fa-solid fa-arrow-left mr-1"></i> Berita</a></div></header>
<main class="mx-auto max-w-4xl px-4 py-8 sm:py-12"><article class="overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">{{if .Item.ImageURL}}<img src="{{.Item.ImageURL}}" alt="{{.Item.Title}}" class="max-h-[460px] w-full object-cover">{{end}}<div class="p-6 sm:p-10"><p class="text-xs font-extrabold uppercase tracking-widest text-emerald-700">{{.Item.Category}}</p><h1 class="mt-3 text-3xl font-extrabold leading-tight sm:text-4xl">{{.Item.Title}}</h1>{{if .Item.Subtitle}}<p class="mt-4 text-lg text-slate-600">{{.Item.Subtitle}}</p>{{end}}<div class="mt-7 whitespace-pre-wrap border-t border-slate-100 pt-6 text-base leading-8 text-slate-700">{{.Item.Body}}</div></div></article></main><footer class="py-8 text-center text-xs text-slate-500">© 2026 {{.School.SchoolName}}</footer></body></html>
