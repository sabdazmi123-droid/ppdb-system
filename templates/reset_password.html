<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atur Ulang Kata Sandi — PPDB RA Tunas Cendekia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="flex min-h-screen items-center justify-center bg-emerald-50 p-4 text-slate-800">
    <main class="w-full max-w-lg rounded-3xl border border-emerald-100 bg-white p-6 shadow-xl sm:p-9">
        <a href="/login" class="inline-flex items-center gap-2 text-sm font-semibold text-emerald-700 hover:text-emerald-900"><i class="fa-solid fa-arrow-left"></i> Kembali ke login</a>
        <div class="mt-7 flex h-14 w-14 items-center justify-center rounded-2xl bg-emerald-100 text-emerald-700"><i class="fa-solid fa-lock text-xl"></i></div>
        <h1 class="mt-5 text-2xl font-extrabold">Buat kata sandi baru</h1>
        <p class="mt-2 text-sm leading-relaxed text-slate-600">Tautan pemulihan berlaku selama 30 menit dan hanya dapat digunakan satu kali.</p>
        {{if .ErrorMsg}}<div role="alert" class="mt-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm leading-relaxed text-red-800">{{.ErrorMsg}}</div>{{end}}
        {{if .Token}}
        <form action="/reset-password" method="POST" class="mt-6 space-y-4">
            <input type="hidden" name="token" value="{{.Token}}">
            <label class="block"><span class="mb-1.5 block text-sm font-bold">Kata sandi baru</span><input type="password" name="password" required minlength="8" maxlength="72" autocomplete="new-password" class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100" placeholder="Minimal 8 karakter"></label>
            <label class="block"><span class="mb-1.5 block text-sm font-bold">Ulangi kata sandi baru</span><input type="password" name="confirm_password" required minlength="8" maxlength="72" autocomplete="new-password" class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100" placeholder="Ketik ulang kata sandi baru"></label>
            <button type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl bg-emerald-700 px-5 py-3.5 font-bold text-white transition hover:bg-emerald-800"><i class="fa-solid fa-floppy-disk"></i> Simpan kata sandi baru</button>
        </form>
        {{else}}
        <a href="/lupa-password" class="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-emerald-700 px-5 py-3.5 font-bold text-white transition hover:bg-emerald-800"><i class="fa-solid fa-rotate"></i> Minta tautan baru</a>
        {{end}}
    </main>
</body>
</html>
