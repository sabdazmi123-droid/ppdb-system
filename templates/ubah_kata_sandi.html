{{define "content"}}
<div class="max-w-2xl mx-auto space-y-6">
    <div>
        <p class="text-sm font-semibold text-emerald-700">Pengaturan Akun</p>
        <h1 class="mt-1 text-2xl font-extrabold text-slate-900">Ubah Kata Sandi</h1>
        <p class="mt-2 text-sm text-slate-600">Masukkan kata sandi saat ini, lalu pilih kata sandi baru yang mudah Anda ingat dan sulit ditebak.</p>
    </div>

    {{if .ErrorMsg}}
    <div role="alert" class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-medium text-red-700">{{.ErrorMsg}}</div>
    {{end}}
    {{if .SuccessMsg}}
    <div role="status" class="rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm font-medium text-emerald-700">{{.SuccessMsg}}</div>
    {{end}}

    <form method="POST" action="/ubah-kata-sandi" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7 space-y-5">
        <div>
            <label for="current_password" class="mb-2 block text-sm font-semibold text-slate-700">Kata sandi saat ini</label>
            <input id="current_password" name="current_password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100" placeholder="Masukkan kata sandi saat ini">
        </div>
        <div>
            <label for="new_password" class="mb-2 block text-sm font-semibold text-slate-700">Kata sandi baru</label>
            <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="8" required class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100" placeholder="Minimal 8 karakter">
        </div>
        <div>
            <label for="confirm_password" class="mb-2 block text-sm font-semibold text-slate-700">Ulangi kata sandi baru</label>
            <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-emerald-600 focus:ring-2 focus:ring-emerald-100" placeholder="Ketik ulang kata sandi baru">
        </div>
        <button type="submit" class="w-full rounded-xl bg-emerald-700 px-5 py-3 font-bold text-white shadow-sm transition hover:bg-emerald-800">Simpan Kata Sandi Baru</button>
    </form>
</div>
{{end}}
